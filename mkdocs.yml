site_name: Economic Time Series in Python
site_description: A practical manual on manipulating economic time series in Python.
site_author: Hugo Morão
repo_url: https://github.com/hmorao95/econ-time-series-manual
repo_name: hmorao95/econ-time-series-manual

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.top
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

nav:
  - Home: index.md
  - 1. Dates and frequencies: 01-dates-frequencies.md
  - 2. Transformations: 02-transformations.md
  - 3. Temporal aggregation: 03-aggregation.md
  - 4. Interpolation and disaggregation: 04-interpolation.md
  - 5. Seasonal adjustment: 05-seasonal-adjustment.md
  - 6. Detrending and filtering: 06-detrending.md
  - 7. Rolling windows and smoothing: 07-rolling-smoothing.md
  - 8. Business cycles: 08-business-cycles.md
  - 9. Diagnostics: 09-diagnostics.md
  - 10. Crisis dummies and bands: 10-crisis-dummies.md
  - Cheat sheet: cheatsheet.md

markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex: {generic: true}

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
